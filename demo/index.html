<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JJEditor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .editor {
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 200px;
      padding: 16px;
      outline: none;
    }

    .editor:focus {
      border-color: #666;
    }
  </style>
</head>

<body>
  <h1>JJEditor</h1>
  <div id="editor" class="editor"></div>
  <script type="module" src="./dist/main.js"></script>
</body>

</html>
